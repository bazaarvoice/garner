org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true

# Maven Central coordinates and POM. No secrets here: CI passes the credentials and the signing
# key as Gradle properties (see sdk/build.gradle.kts).
GROUP=com.bazaarvoice
POM_ARTIFACT_ID=bv-garner-sdk-android
POM_NAME=Bazaarvoice Garner SDK for Android
POM_DESCRIPTION=Push notifications for Bazaarvoice review requests: device registration, consumer identity, display rules, quiet hours and review links.
POM_URL=https://github.com/bazaarvoice/garner
POM_SCM_URL=https://github.com/bazaarvoice/garner
POM_SCM_CONNECTION=scm:git:https://github.com/bazaarvoice/garner.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/bazaarvoice/garner.git
POM_LICENSE_NAME=Bazaarvoice SDK License
POM_LICENSE_URL=https://www.bazaarvoice.com/legal/terms-of-use/api/
POM_LICENSE_DIST=repo
POM_DEVELOPER_ID=bazaarvoice
POM_DEVELOPER_NAME=Bazaarvoice, Inc.
POM_DEVELOPER_URL=https://www.bazaarvoice.com
